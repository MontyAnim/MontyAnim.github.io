{{- define "main" }}

<article class="cv-page" style="max-width: 900px; margin: 0 auto; padding: 2rem;">
  <!-- Header Section -->
  <header class="cv-header" style="text-align: center; padding: 3rem 0; margin-bottom: 3rem;">
    <h1 style="font-size: 3rem; margin-bottom: 0.5rem;">{{ .Params.author | default "Diego Montúfar Pérez" }}</h1>
    <h2 style="font-size: 1.5rem; color: var(--secondary); margin-bottom: 2rem; font-weight: 400;">3D Artist | Technical Artist</h2>
    
    <div class="contact-info" style="display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; font-size: 0.95rem;">
      <a href="mailto:diego.montufar@outlook.com" style="color: var(--content); text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
        diego.montufar@outlook.com
      </a>
      <span style="color: var(--content); display: flex; align-items: center; gap: 0.5rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        +52 (442) 863 2403
      </a>
    </div>
    
    <div class="social-links" style="justify-content: center; margin-top: 1.5rem;">
      <a href="https://www.artstation.com/monty_anim" target="_blank" rel="noopener" title="ArtStation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M0 17.723l2.027 3.505h.001a2.424 2.424 0 0 0 2.164 1.333h13.457l-2.792-4.838H0zm24 .025c0-.484-.143-.935-.388-1.314L15.728 2.728a2.424 2.424 0 0 0-2.142-1.289H9.419L21.598 22.54l1.92-3.325c.378-.637.482-.919.482-1.467zm-11.129-3.462L7.428 6.858l-5.444 9.428h10.887z"/></svg>
      </a>

      </a>
      <a href="https://www.linkedin.com/in/diego-montufarperez" target="_blank" rel="noopener" title="LinkedIn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
      </a>
    </div>
  </header>

  <!-- CV Content -->
  <div class="cv-content" style="line-height: 1.8;">
    {{ .Content }}
  </div>
  
  <!-- Action Buttons -->
  <div class="cv-actions" style="margin-top: 4rem; padding: 2rem; background: var(--surface); border-radius: 10px; text-align: center;">
    <h3 style="margin-bottom: 1.5rem; font-size: 1.5rem;">Ready to collaborate?</h3>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="/projects/" style="padding: 1rem 2rem; background: var(--primary); color: var(--primary-text); text-decoration: none; border-radius: 6px; font-weight: 600; font-family: sans-serif; transition: transform 0.2s; display: inline-block;">
        View My Work
      </a>
      <a href="/contact/" style="padding: 1rem 2rem; border: 2px solid var(--primary); color: var(--primary); text-decoration: none; border-radius: 6px; font-weight: 600; font-family: sans-serif; transition: transform 0.2s; display: inline-block;">
        Get in Touch
      </a>
    </div>
  </div>
</article>

<style>
.cv-content h2 {
  color: var(--accent);
  border-bottom: 2px solid var(--border);
  padding-bottom: 0.5rem;
  margin-top: 3rem;
  margin-bottom: 1.5rem;
  font-size: 1.75rem;
}

.cv-content h3 {
  color: var(--content);
  margin-top: 2rem;
  margin-bottom: 1rem;
  font-size: 1.25rem;
}

.cv-content ul {
  margin-left: 1.5rem;
  margin-bottom: 1.5rem;
}

.cv-content li {
  margin-bottom: 0.75rem;
}

.cv-content a.button {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.6rem 1.25rem;
  color: var(--content);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 500;
  margin: 0.25rem 0.5rem 0.25rem 0;
  transition: background 0.2s, border-color 0.2s, transform 0.2s;
}

.cv-content a.button:hover {
  background: var(--entry);
  border-color: var(--primary);
  color: var(--primary);
  transform: translateY(-2px);
}

.cv-content strong {
  color: var(--accent);
}

.cv-actions a:hover {
  transform: translateY(-2px);
}

@media print {
  .cv-header .social-links,
  .cv-actions {
    display: none;
  }
  
  .cv-header {
    padding: 1rem 0;
  }
}
</style>

{{- end }}
