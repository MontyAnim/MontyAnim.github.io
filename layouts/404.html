{{- define "main" }}

<div class="error-404" style="min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
  <div style="max-width: 600px;">
    <h1 style="font-size: clamp(4rem, 15vw, 10rem); font-weight: 700; margin-bottom: 1rem; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
      404
    </h1>
    
    <h2 style="font-size: clamp(1.5rem, 4vw, 2.5rem); margin-bottom: 1.5rem; color: var(--content);">
      Page Not Found
    </h2>
    
    <p style="font-size: 1.125rem; color: var(--secondary); margin-bottom: 3rem; line-height: 1.6;">
      The page you're looking for doesn't exist or has been moved. Let's get you back on track.
    </p>
    
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="/" style="padding: 1rem 2rem; background: var(--primary); color: var(--primary-text); text-decoration: none; border-radius: 4px; font-weight: 600; transition: transform 0.2s; display: inline-block;">
        Go Home
      </a>
      <a href="/projects/" style="padding: 1rem 2rem; border: 2px solid var(--primary); color: var(--primary); text-decoration: none; border-radius: 4px; font-weight: 600; transition: transform 0.2s; display: inline-block;">
        View Projects
      </a>
      <a href="/contact/" style="padding: 1rem 2rem; border: 2px solid var(--border); color: var(--content); text-decoration: none; border-radius: 4px; font-weight: 600; transition: transform 0.2s; display: inline-block;">
        Contact
      </a>
    </div>
    
    <!-- Fun ASCII art or code-themed decoration -->
    <div style="margin-top: 4rem; font-family: 'Courier New', monospace; color: var(--border); font-size: 0.875rem; line-height: 1.4;">
      <pre style="display: inline-block; text-align: left; background: var(--code-bg); padding: 1rem; border-radius: 4px; border: 1px solid var(--border);">
// Error: Resource not found
if (page.exists()) {
    return page.render();
} else {
    return 404;
}
      </pre>
    </div>
  </div>
</div>

<style>
.error-404 a:hover {
  transform: translateY(-2px);
}
</style>

{{- end }}
