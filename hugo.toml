baseURL = 'https://montyanim.github.io/'
languageCode = 'en-us'
title = 'Diego Montúfar Portfolio'
theme = 'PaperMod'

[params]
  description = "Technical Artist specializing in tools, shaders, and pipeline development for games and VFX"
  author = "Diego Montúfar"
  keywords = ["Technical Artist", "Game Development", "Shaders", "Python", "Unity", "Maya", "Pipeline Tools"]
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

[params.homeInfoParams]
  Title = "Diego Montúfar Pérez"
  Content = "Technical Artist bridging art and code through tools, shaders, and pipeline development"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/MontyAnim"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10
  [[menu.main]]
    identifier = "cv"
    name = "CV"
    url = "/cv/"
    weight = 15
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 20
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
